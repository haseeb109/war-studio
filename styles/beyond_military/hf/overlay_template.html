<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face{font-family:"Inter";font-weight:800;src:url("fonts/inter-latin-800-normal.woff2") format("woff2");}
  @font-face{font-family:"Inter";font-weight:600;src:url("fonts/inter-latin-600-normal.woff2") format("woff2");}
  html,body{margin:0;padding:0;background:transparent;width:1920px;height:1080px;overflow:hidden;}
  #root{position:relative;width:1920px;height:1080px;background:transparent;}
  .box{position:absolute;top:60px;background:#FFC400;color:#0B0B0B;border-radius:12px;padding:14px 36px 16px;
       text-align:center;font-family:"Inter";transform-origin:50% 0;}
  .l1{font-weight:800;font-size:64px;line-height:1.05;white-space:nowrap;}
  .l2{font-weight:600;font-size:40px;line-height:1.1;margin-top:4px;white-space:nowrap;}
  .top_right{right:70px;} .top_left{left:70px;} .top_center{left:50%;transform:translateX(-50%);}
  .label{position:absolute;top:70px;left:70px;display:flex;height:92px;}
  .label .bar{width:16px;background:#FFC400;}
  .label .txt{background:#0B0B0B;color:#fff;font:800 54px/92px "Inter";padding:0 30px;white-space:nowrap;}
</style>
</head>
<body>
<div id="root" data-composition-id="root" data-width="1920" data-height="1080" data-start="0" data-duration="__DUR__">
  <div id="wrap"></div>
</div>
<script src="gsap.min.js"></script>
<script>
  const KIND = "__KIND__", POS = "__POS__", L1 = "__L1__", L2 = "__L2__", D = __DUR__;
  const wrap = document.getElementById("wrap");
  let el;
  if (KIND === "label") {
    wrap.innerHTML = '<div class="label" id="el"><div class="bar"></div><div class="txt">' + L1 + '</div></div>';
  } else {
    wrap.innerHTML = '<div class="box ' + POS + '" id="el"><div class="l1">' + L1 + '</div>' +
                     (L2 ? '<div class="l2">' + L2 + '</div>' : '') + '</div>';
  }
  el = document.getElementById("el");
  const tl = gsap.timeline({ paused: true });
  if (KIND === "label") {
    tl.fromTo(el, { x: -80, opacity: 0 }, { x: 0, opacity: 1, duration: 0.25, ease: "power3.out" }, 0);
  } else {
    const base = POS === "top_center" ? { xPercent: -50 } : {};
    gsap.set(el, Object.assign({ transform: "none" }, base));
    tl.fromTo(el, Object.assign({ scale: 0.82, opacity: 0 }, base),
                  Object.assign({ scale: 1, opacity: 1, duration: 0.22, ease: "back.out(2)" }, base), 0);
  }
  tl.to(el, { opacity: 0, duration: 0.2 }, Math.max(0.35, D - 0.2));
  window.__timelines = window.__timelines || {};
  window.__timelines["root"] = tl;
</script>
</body>
</html>
