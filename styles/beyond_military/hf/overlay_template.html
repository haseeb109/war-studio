<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face{font-family:"Inter";font-weight:800;src:url("fonts/inter-latin-800-normal.woff2") format("woff2");}
  @font-face{font-family:"Inter";font-weight:600;src:url("fonts/inter-latin-600-normal.woff2") format("woff2");}
  html,body{margin:0;padding:0;background:transparent;width:1920px;height:1080px;overflow:hidden;}
  #root{position:relative;width:1920px;height:1080px;background:transparent;}
  .box{position:absolute;top:60px;background:#FFC400;color:#0B0B0B;border-radius:12px;padding:14px 36px 16px;
       text-align:center;font-family:"Inter";transform-origin:50% 0;}
  .l1{font-weight:800;font-size:64px;line-height:1.05;white-space:nowrap;}
  .l2{font-weight:600;font-size:40px;line-height:1.1;margin-top:4px;white-space:nowrap;}
  .top_right{right:70px;} .top_left{left:70px;} .top_center{left:50%;transform:translateX(-50%);}
  .label{position:absolute;top:70px;left:70px;display:flex;height:92px;}
  .label .bar{width:16px;background:#FFC400;}
  .label .txt{background:#0B0B0B;color:#fff;font:800 54px/92px "Inter";padding:0 30px;white-space:nowrap;}
  /* hook: tactical HUD caption, bottom-left, types itself in */
  .hook{position:absolute;left:70px;bottom:146px;display:flex;align-items:stretch;height:84px;}
  .hook .bar{width:10px;background:#FFC400;}
  .hook .txt{position:relative;background:rgba(11,11,11,.80);color:#fff;font:800 46px/84px "Inter";
             letter-spacing:3px;padding:0 58px 0 28px;white-space:nowrap;}
  .hook .cur{display:inline-block;width:20px;height:40px;background:#FFC400;margin-left:8px;vertical-align:-4px;}
  .hook .tag{position:absolute;left:0;top:-32px;font:600 20px/24px "Inter";letter-spacing:5px;color:#FFC400;}
  .hook .br{position:absolute;right:0;width:22px;height:22px;border-color:#FFC400;border-style:solid;}
  .hook .br.t{top:0;border-width:4px 4px 0 0;} .hook .br.b{bottom:0;border-width:0 4px 4px 0;}
  .hook .scan{position:absolute;left:0;top:0;bottom:0;width:6px;background:rgba(255,196,0,.55);}
</style>
</head>
<body>
<div id="root" data-composition-id="root" data-width="1920" data-height="1080" data-start="0" data-duration="__DUR__">
  <div id="wrap"></div>
</div>
<script src="gsap.min.js"></script>
<script>
  const KIND = "__KIND__", POS = "__POS__", L1 = "__L1__", L2 = "__L2__", D = __DUR__;
  const wrap = document.getElementById("wrap");
  let el;
  if (KIND === "hook") {
    wrap.innerHTML = '<div class="hook" id="el"><span class="tag">&#9656; INTEL</span><div class="bar"></div><div class="txt" id="hb">' +
      '<span id="ht"></span><span class="cur" id="hc"></span>' +
      '<div class="br t"></div><div class="br b"></div><div class="scan" id="hs"></div></div></div>';
  } else if (KIND === "label") {
    wrap.innerHTML = '<div class="label" id="el"><div class="bar"></div><div class="txt">' + L1 + '</div></div>';
  } else {
    wrap.innerHTML = '<div class="box ' + POS + '" id="el"><div class="l1">' + L1 + '</div>' +
                     (L2 ? '<div class="l2">' + L2 + '</div>' : '') + '</div>';
  }
  el = document.getElementById("el");
  const tl = gsap.timeline({ paused: true });
  if (KIND === "hook") {
    // decode text as plain characters (L1 is HTML-escaped by the server)
    const tmp = document.createElement("textarea"); tmp.innerHTML = L1; const TXT = tmp.value;
    const ht = document.getElementById("ht"), hb = document.getElementById("hb");
    const typeDur = Math.min(0.5, Math.max(0.25, D * 0.25));
    gsap.set(hb, { clipPath: "inset(0 100% 0 0)" });
    tl.fromTo(el, { x: -40, opacity: 0 }, { x: 0, opacity: 1, duration: 0.18, ease: "power3.out" }, 0);
    tl.to(hb, { clipPath: "inset(0 0% 0 0)", duration: 0.2, ease: "power2.out" }, 0);
    const st = { n: 0 };
    tl.to(st, { n: TXT.length, duration: typeDur, ease: "none",
                onUpdate: () => { ht.textContent = TXT.slice(0, Math.round(st.n)); } }, 0.05);
    tl.fromTo("#hs", { x: 0, opacity: 1 }, { x: 900, opacity: 0, duration: 0.45, ease: "power1.in" }, 0.05);
    const blinks = Math.max(1, Math.floor((D - 0.3) / 0.25));
    tl.to("#hc", { opacity: 0, duration: 0.125, repeat: blinks, yoyo: true, ease: "steps(1)" }, 0.05 + typeDur);
  } else if (KIND === "label") {
    tl.fromTo(el, { x: -80, opacity: 0 }, { x: 0, opacity: 1, duration: 0.25, ease: "power3.out" }, 0);
  } else {
    const base = POS === "top_center" ? { xPercent: -50 } : {};
    gsap.set(el, Object.assign({ transform: "none" }, base));
    tl.fromTo(el, Object.assign({ scale: 0.82, opacity: 0 }, base),
                  Object.assign({ scale: 1, opacity: 1, duration: 0.22, ease: "back.out(2)" }, base), 0);
  }
  tl.to(el, { opacity: 0, duration: 0.2 }, Math.max(0.35, D - 0.2));
  window.__timelines = window.__timelines || {};
  window.__timelines["root"] = tl;
</script>
</body>
</html>
