<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="maplibre-gl.css">
<style>
  html,body{margin:0;padding:0;width:1920px;height:1080px;overflow:hidden;background:#05070a;}
  #root{position:relative;width:1920px;height:1080px;}
  #map{position:absolute;inset:0;}
  #fx{position:absolute;inset:0;pointer-events:none;}
  .lbl{position:absolute;transform:translate(-50%,-50%);font:800 34px/1 "Helvetica Neue",Arial,sans-serif;color:#fff;
       letter-spacing:2px;text-shadow:0 2px 8px #000,0 0 2px #000;white-space:nowrap;}
  .lbl.small{font-size:26px;font-weight:700;color:#FFC400;}
  .title{position:absolute;left:70px;top:60px;display:flex;height:84px;}
  .title .bar{width:14px;background:var(--acc)}.title .txt{background:#0B0B0B;color:#fff;font:800 48px/84px "Helvetica Neue",Arial;padding:0 28px}
  .maplibregl-ctrl-attrib,.maplibregl-ctrl-bottom-left,.maplibregl-ctrl-logo{display:none!important}
</style>
</head>
<body>
<div id="root" data-composition-id="root" data-width="1920" data-height="1080" data-start="0" data-duration="__DUR__">
  <div id="map"></div>
  <svg id="fx" width="1920" height="1080"></svg>
  <div id="labels"></div>
</div>
<script src="maplibre-gl.js"></script>
<script src="gsap.min.js"></script>
<script>
const P = __PLAN__;                       // {duration, title, from:{center,zoom}, to:{center,zoom}, highlight:[{iso,color}],
                                          //  points:[{name,lon,lat}], arrows:[{from:[lon,lat],to:[lon,lat]}], rings:[{lon,lat,km}]}
const D = P.duration;
const TH = Object.assign({sea: "#081321", land: "#1b2430", border: "#4b5a6b", hl: "#ffffff", arrow: "#ff3b30", ring: "#FFC400",
  label: "#fff", accent: "#FFC400", font: '"Helvetica Neue",Arial,sans-serif', grid: "", scan: false, sweep: false,
  hl_opacity: 0.75, tint: "", vignette: 0, glow: "", depth: 0, soft: 0}, P.theme || {});
if (TH.soft) document.getElementById("map").style.filter = `blur(${TH.soft}px)`;   // a touch softer, like filmed footage
document.documentElement.style.setProperty("--acc", TH.accent);
const map = new maplibregl.Map({
  container: "map", interactive: false, attributionControl: false, fadeDuration: 0,
  preserveDrawingBuffer: true, maxPitch: 70, pixelRatio: P.pixel_ratio || 1, center: P.from.center, zoom: P.from.zoom,
  style: {version: 8, sources: {}, layers: [{id: "sea", type: "background", paint: {"background-color": TH.sea}}]}
});
const HL = {};
(P.highlight || []).forEach(h => HL[h.iso] = h.color);
function ringCoords(lon, lat, km) {
  const pts = [];
  for (let i = 0; i <= 96; i++) {
    const a = i / 96 * 2 * Math.PI, dLat = km / 111 * Math.cos(a), dLon = km / (111 * Math.cos(lat * Math.PI / 180)) * Math.sin(a);
    pts.push([lon + dLon, lat + dLat]);
  }
  return pts;
}
const state = {t: 0};
const FONT = String(TH.font).replace(/"/g, "'");      // quotes would end the style="" attribute
const clamp = v => Math.min(1, Math.max(0, v)), outCubic = v => 1 - Math.pow(1 - v, 3);
const outBack = v => 1 + 2.2 * Math.pow(v - 1, 3) + 1.2 * Math.pow(v - 1, 2);
// the order things appear in: countries -> pins drop -> arrows draw -> rings spread (scaled to the clip length)
const T_HL = Math.min(D * 0.04, 0.15), T_PIN = Math.min(D * 0.30, 1.2), PIN_GAP = 0.18;
const CAM = P.cam || "keys", LFX = P.label_fx || "drop";
const T_ARROW = T_PIN + 0.45 + (P.points || []).length * PIN_GAP * 0.5;
const ARROW_LEN = CAM === "follow_arrow" ? Math.min(2.4, Math.max(1.2, D * 0.5)) : Math.min(1.4, Math.max(0.6, D * 0.3));
const T_RING = T_ARROW + ((P.arrows || []).length ? ARROW_LEN * 0.8 : 0);
let lastHl = -1;
const inout = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const lerp = (a, b, e) => a + (b - a) * e;
function geoCurve(A, B, u) {                       // the same bend as the drawn arrow, in lon/lat
  const mx = (A[0] + B[0]) / 2 - (B[1] - A[1]) * 0.18, my = (A[1] + B[1]) / 2 + (B[0] - A[0]) * 0.18;
  return [(1-u)*(1-u)*A[0] + 2*(1-u)*u*mx + u*u*B[0], (1-u)*(1-u)*A[1] + 2*(1-u)*u*my + u*u*B[1]];
}
function camAt(t) {
  const z = P.to.zoom, pb = P.to.pitch || 0, bb = P.to.bearing || 0;
  if (CAM === "follow_arrow" && (P.arrows || [])[0]) {          // the camera travels with the arrow, A -> B
    const a = P.arrows[0], u = outCubic(clamp((t - T_ARROW) / ARROW_LEN));
    const pre = clamp(t / Math.max(0.1, T_ARROW)), post = clamp((t - T_ARROW - ARROW_LEN) / 1.5);
    return {center: geoCurve(a.from, a.to, u), zoom: z + 0.7 - 0.45 * Math.sin(Math.PI * u) + 0.2 * post + 0.1 * pre,
            pitch: 42 + 6 * u, bearing: bb - 12 + 24 * clamp(t / D)};
  }
  if (CAM === "point_hop" && (P.points || []).length > 1) {     // sits on the first place, then glides to the next
    const A = [P.points[0].lon, P.points[0].lat], B = [P.points[1].lon, P.points[1].lat];
    const h0 = T_PIN + 0.5, u = inout(clamp((t - h0) / Math.max(1.2, D * 0.4)));
    return {center: [lerp(A[0], B[0], u), lerp(A[1], B[1], u)], zoom: z + 0.8 - 0.6 * Math.sin(Math.PI * u),
            pitch: 30 + 15 * Math.sin(Math.PI * u), bearing: bb + 20 * (u - 0.5)};
  }
  const k = clamp(t / Math.max(0.1, D * 0.92)), e = P.ease === "linear" ? k : inout(k);
  return {center: [lerp(P.from.center[0], P.to.center[0], e), lerp(P.from.center[1], P.to.center[1], e)],
          zoom: lerp(P.from.zoom, z, e), pitch: lerp(P.from.pitch || 0, pb, e), bearing: lerp(P.from.bearing || 0, bb, e)};
}
function draw() {
  const t = state.t;
  map.jumpTo(camAt(t));
  const hl = outCubic(clamp((t - T_HL) / 0.6));
  if (Math.abs(hl - lastHl) > 0.01 && map.getLayer("land")) {
    lastHl = hl;
    map.setPaintProperty("land", "fill-opacity", ["match", ["get", "iso"], ...Object.keys(HL).flatMap(c => [c, TH.hl_opacity * hl]), 1]);
    map.setPaintProperty("land", "fill-color", ["match", ["get", "iso"], ...Object.entries(HL).flatMap(([c, col]) => [c, col]), TH.land]);
    map.setPaintProperty("hl", "line-opacity", hl);
  }
  if (map.getLayer("hlglow")) map.setPaintProperty("hlglow", "line-opacity", 0.45 * hl * (0.7 + 0.3 * Math.sin(t * 3.2)));   // borders breathe
  map.redraw();                           // synchronous: this frame is complete before HyperFrames takes it
  const fx = document.getElementById("fx");
  let svg = `<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="${TH.arrow}"/></marker></defs>`;
  if (TH.tint) svg += `<rect width="1920" height="1080" fill="${TH.tint}"/>`;
  (P.rings || []).forEach((r, i) => {
    const show = outCubic(clamp((t - T_RING - i * 0.25) / 0.7));
    if (show <= 0) return;
    const c = [r.lon, r.lat], pts = ringCoords(r.lon, r.lat, r.km * (0.6 + 0.4 * show)).map(q => map.project(q));
    const pl = pts.map(p => p.x + "," + p.y).join(" ");
    svg += `<polygon points="${pl}" fill="${TH.ring}" fill-opacity="${(0.08 + 0.05 * Math.sin(t * 4)) * show}" stroke="${TH.ring}" stroke-width="10" opacity="${0.18 * show}"/>` +
           `<polygon points="${pl}" fill="none" stroke="${TH.ring}" stroke-width="3" stroke-dasharray="14 10" stroke-dashoffset="${-t * 40}" opacity="${show}"/>`;
    if (show >= 1) {                                                   // radar ping from the centre, every 2 s
      const ph = ((t - T_RING) % 2) / 2, ring = ringCoords(r.lon, r.lat, r.km * ph).map(q => map.project(q));
      svg += `<polygon points="${ring.map(p => p.x + "," + p.y).join(" ")}" fill="none" stroke="${TH.ring}" stroke-width="2" opacity="${0.7 * (1 - ph)}"/>`;
    }
  });
  (P.arrows || []).forEach((a, i) => {
    const t0 = T_ARROW + i * 0.35, s = clamp((t - t0) / ARROW_LEN), se = outCubic(s);
    if (s <= 0) return;
    const A = map.project(a.from), B = map.project(a.to);
    const mx = (A.x + B.x) / 2 - (B.y - A.y) * 0.18, my = (A.y + B.y) / 2 + (B.x - A.x) * 0.18;
    const n = 40, pts = [];
    for (let j = 0; j <= Math.round(n * se); j++) { const u = j / n; pts.push([(1-u)*(1-u)*A.x + 2*(1-u)*u*mx + u*u*B.x, (1-u)*(1-u)*A.y + 2*(1-u)*u*my + u*u*B.y]); }
    if (pts.length > 1) {
      const pl = pts.map(p => p.join(",")).join(" ");
      svg += `<polyline points="${pl}" fill="none" stroke="${TH.arrow}" stroke-width="22" stroke-linecap="round" opacity=".22"/>` +   // glow trail
             `<polyline points="${pl}" fill="none" stroke="${TH.arrow}" stroke-width="7" stroke-linecap="round" ${se > 0.15 ? 'marker-end="url(#ah)"' : ""}/>`;
      if (s >= 1)                                                    // drawn: bright dashes keep flowing along it
        svg += `<polyline points="${pl}" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-dasharray="16 30" stroke-dashoffset="${-t * 140}" opacity=".55"/>`;
    }
    const after = t - t0 - ARROW_LEN;
    if (after > 0) {                                                  // impact pulse where it lands, repeating, and a blinking dot
      const imp = (after % 1.4) / 1.4;
      svg += `<circle cx="${B.x}" cy="${B.y}" r="${10 + 60 * outCubic(imp)}" fill="none" stroke="${TH.arrow}" stroke-width="${5 * (1 - imp) + 1}" opacity="${1 - imp}"/>` +
             `<circle cx="${B.x}" cy="${B.y}" r="9" fill="${TH.arrow}" opacity="${0.55 + 0.45 * Math.sin(t * 9)}"/>` +
             `<circle cx="${B.x}" cy="${B.y}" r="22" fill="${TH.arrow}" opacity="${0.18 + 0.12 * Math.sin(t * 9)}"/>`;
    }
  });
  if (TH.grid) { for (let x = 0; x <= 1920; x += 120) svg += `<line x1="${x}" y1="0" x2="${x}" y2="1080" stroke="${TH.grid}" stroke-width="1"/>`;
                 for (let y = 0; y <= 1080; y += 120) svg += `<line x1="0" y1="${y}" x2="1920" y2="${y}" stroke="${TH.grid}" stroke-width="1"/>`; }
  if (TH.sweep && (P.rings || [])[0]) { const r0 = P.rings[0], c = map.project([r0.lon, r0.lat]), e2 = map.project(ringCoords(r0.lon, r0.lat, r0.km)[0]);
    const R = Math.hypot(e2.x - c.x, e2.y - c.y), a = t * 2.2;
    svg += `<line x1="${c.x}" y1="${c.y}" x2="${c.x + R * Math.cos(a)}" y2="${c.y + R * Math.sin(a)}" stroke="${TH.ring}" stroke-width="4" opacity=".9"/>`;
    [0.33, 0.66].forEach(f => svg += `<circle cx="${c.x}" cy="${c.y}" r="${R * f}" fill="none" stroke="${TH.ring}" stroke-width="1.5" opacity=".5"/>`); }
  if (TH.vignette) svg += `<defs><radialGradient id="vg"><stop offset="55%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity="${TH.vignette}"/></radialGradient></defs><rect width="1920" height="1080" fill="url(#vg)"/>`;
  if (TH.scan) svg += `<rect width="1920" height="1080" fill="url(#scan)"/><defs><pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="2" fill="rgba(0,0,0,.18)"/></pattern></defs>`;
  fx.innerHTML = svg;
  let lab = "";
  const placed = [];
  const cz = clamp((map.getZoom() - (P.label_zoom || 4.2)) / 0.6) * hl;       // names only once there is room
  const cpos = (P.countries || []).map(c => { const q = map.project(c.at); if (cz > 0.05) placed.push({x: q.x, y: q.y, w: c.name.length * 26}); return q; });
  (P.points || []).forEach((p, i) => {
    const d = clamp((t - T_PIN - i * PIN_GAP) / 0.45), q = map.project([p.lon, p.lat]);
    if (d <= 0) return;
    const drop = (1 - outBack(d)) * -70, o = clamp(d * 2);                         // the pin falls into place
    let ly = q.y - 36;                                                             // label above; below if it would collide
    const w = p.name.length * 18, hit = y => placed.some(b => Math.abs(b.x - q.x) < (b.w + w) / 2 + 10 && Math.abs(b.y - y) < 40);
    if (hit(ly)) ly = q.y + 36;
    if (hit(ly)) ly = q.y - 76;
    placed.push({x: q.x, y: ly, w});
    const land = clamp((d - 0.55) / 0.45);
    if (land > 0) {                                                  // landing ring, then a soft ping every 1.2 s
      const ph = land < 1 ? land : ((t - T_PIN - i * PIN_GAP - 0.45) % 1.2) / 1.2;
      lab += `<div style="position:absolute;left:${q.x}px;top:${q.y}px;width:${18 + 54 * ph}px;height:${18 + 54 * ph}px;transform:translate(-50%,-50%);border-radius:50%;border:2px solid ${TH.accent};opacity:${(1 - ph) * (land < 1 ? 1 : 0.7)}"></div>`;
    }
    const glow = 10 + 8 * Math.sin(t * 5 + i);
    lab += `<div style="position:absolute;left:${q.x}px;top:${q.y + drop}px;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:${TH.accent};box-shadow:0 0 0 6px rgba(0,0,0,.25),0 0 ${glow}px ${glow / 2}px ${TH.accent};opacity:${o}"></div>`;
    const lv = clamp((d - 0.4) / 0.6);                                // label: drop / type / slide (varies per map)
    let name = p.name, lx = q.x, lo = lv;
    if (LFX === "type") { name = p.name.slice(0, Math.ceil(p.name.length * lv)) + (lv < 1 && Math.floor(t * 6) % 2 ? "▍" : ""); lo = lv > 0 ? 1 : 0; }
    if (LFX === "slide") lx = q.x - 40 * (1 - outCubic(lv));
    lab += `<div class="lbl small" style="left:${lx}px;top:${ly}px;opacity:${lo};color:${TH.accent};font-family:${FONT}">${name}</div>`;
  });
  (P.countries || []).forEach((c, ci) => { const q = cpos[ci]; lab += `<div class="lbl" style="left:${q.x}px;top:${q.y}px;color:${TH.label};font-family:${FONT};opacity:${cz}">${c.name}</div>`; });
  if (P.title) lab += `<div class="title" style="opacity:${clamp(t / 0.3)}"><div class="bar"></div><div class="txt">${P.title}</div></div>`;
  document.getElementById("labels").innerHTML = lab;
}
const mapReady = new Promise(res => map.loaded() ? res() : map.once("load", res));
Promise.all([fetch("countries.geojson").then(r => r.json()), mapReady, document.fonts ? document.fonts.ready : 0]).then(([geo]) => {
  {
    if (!Object.keys(HL).length) HL["___"] = TH.land;      // a match expression needs at least one pair
    map.addSource("c", {type: "geojson", data: geo});
    map.addLayer({id: "land", type: "fill", source: "c", paint: {"fill-color": ["match", ["get", "iso"], ...Object.entries(HL).flat(), TH.land],
                                                                  "fill-opacity": ["match", ["get", "iso"], ...Object.keys(HL).flatMap(k => [k, TH.hl_opacity]), 1]}});
    if (TH.depth) map.addLayer({id: "depth", type: "line", source: "c",                       // soft shading inside every coast/border
      paint: {"line-color": "#000", "line-width": 26, "line-blur": 22, "line-opacity": TH.depth, "line-offset": 12}});
    if (TH.glow) map.addLayer({id: "glow", type: "line", source: "c",                         // faint glow along the coasts
      paint: {"line-color": TH.glow, "line-width": 9, "line-blur": 8, "line-opacity": 0.45}});
    map.addLayer({id: "border", type: "line", source: "c", paint: {"line-color": TH.border, "line-width": 1.2}});
    map.addLayer({id: "hlglow", type: "line", source: "c", filter: ["in", ["get", "iso"], ["literal", Object.keys(HL)]],
                  paint: {"line-color": TH.hl, "line-width": 12, "line-blur": 10, "line-opacity": 0}});
    map.addLayer({id: "hl", type: "line", source: "c", filter: ["in", ["get", "iso"], ["literal", Object.keys(HL)]],
                  paint: {"line-color": TH.hl, "line-width": 3, "line-opacity": 0}});
    (function ready() {          // the borders are loaded -> the timeline exists (HyperFrames waits for it)
      if (!map.isSourceLoaded("c")) return setTimeout(ready, 50);
      const tl = gsap.timeline({paused: true, onUpdate: draw});
      tl.to(state, {t: D, duration: D, ease: "none"}, 0);
      draw();
      window.__timelines = window.__timelines || {};
      window.__timelines["root"] = tl;
    })();
  }
});
</script>
</body>
</html>
