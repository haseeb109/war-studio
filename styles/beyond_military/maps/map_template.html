<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="maplibre-gl.css">
<style>
  html,body{margin:0;padding:0;width:1920px;height:1080px;overflow:hidden;background:#05070a;}
  #root{position:relative;width:1920px;height:1080px;}
  #map{position:absolute;inset:0;}
  #fx{position:absolute;inset:0;pointer-events:none;}
  .lbl{position:absolute;transform:translate(-50%,-50%);font:800 34px/1 "Helvetica Neue",Arial,sans-serif;color:#fff;
       letter-spacing:2px;text-shadow:0 2px 8px #000,0 0 2px #000;white-space:nowrap;}
  .lbl.small{font-size:26px;font-weight:700;color:#FFC400;}
  .title{position:absolute;left:70px;top:60px;display:flex;height:84px;}
  .title .bar{width:14px;background:var(--acc)}.title .txt{background:#0B0B0B;color:#fff;font:800 48px/84px "Helvetica Neue",Arial;padding:0 28px}
  .maplibregl-ctrl-attrib,.maplibregl-ctrl-bottom-left,.maplibregl-ctrl-logo{display:none!important}
</style>
</head>
<body>
<div id="root" data-composition-id="root" data-width="1920" data-height="1080" data-start="0" data-duration="__DUR__">
  <div id="map"></div>
  <svg id="fx" width="1920" height="1080"></svg>
  <div id="labels"></div>
</div>
<script src="maplibre-gl.js"></script>
<script src="gsap.min.js"></script>
<script>
const P = __PLAN__;                       // {duration, title, from:{center,zoom}, to:{center,zoom}, highlight:[{iso,color}],
                                          //  points:[{name,lon,lat}], arrows:[{from:[lon,lat],to:[lon,lat]}], rings:[{lon,lat,km}]}
const D = P.duration;
const TH = Object.assign({sea: "#081321", land: "#1b2430", border: "#4b5a6b", hl: "#ffffff", arrow: "#ff3b30", ring: "#FFC400",
  label: "#fff", accent: "#FFC400", font: '"Helvetica Neue",Arial,sans-serif', grid: "", scan: false, sweep: false,
  satellite: false, sat: {}, grain: 0, land_opacity: 1, hl_opacity: 0.75, tint: "", vignette: 0}, P.theme || {});
document.documentElement.style.setProperty("--acc", TH.accent);
const map = new maplibregl.Map({
  container: "map", interactive: false, attributionControl: false, fadeDuration: 0,
  preserveDrawingBuffer: true, maxTileCacheSize: 6000, maxPitch: 70, center: P.from.center, zoom: P.from.zoom,
  style: {version: 8, sources: {}, layers: [{id: "sea", type: "background", paint: {"background-color": TH.sea}}]}
});
const HL = {};
(P.highlight || []).forEach(h => HL[h.iso] = h.color);
function ringCoords(lon, lat, km) {
  const pts = [];
  for (let i = 0; i <= 96; i++) {
    const a = i / 96 * 2 * Math.PI, dLat = km / 111 * Math.cos(a), dLon = km / (111 * Math.cos(lat * Math.PI / 180)) * Math.sin(a);
    pts.push([lon + dLon, lat + dLat]);
  }
  return pts;
}
const state = {t: 0};
function draw() {
  const k = Math.min(1, state.t / Math.max(0.1, D * 0.85)), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
  map.jumpTo({center: [P.from.center[0] + (P.to.center[0] - P.from.center[0]) * e, P.from.center[1] + (P.to.center[1] - P.from.center[1]) * e],
              zoom: P.from.zoom + (P.to.zoom - P.from.zoom) * e,
              pitch: (P.from.pitch || 0) + ((P.to.pitch || 0) - (P.from.pitch || 0)) * e,
              bearing: (P.from.bearing || 0) + ((P.to.bearing || 0) - (P.from.bearing || 0)) * e});
  map.redraw();                           // synchronous: this frame is complete before HyperFrames takes it
  const fx = document.getElementById("fx");
  let svg = `<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="${TH.arrow}"/></marker></defs>`;
  if (TH.tint) svg += `<rect width="1920" height="1080" fill="${TH.tint}"/>`;
  if (TH.vignette) svg += `<defs><radialGradient id="vg"><stop offset="55%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity="${TH.vignette}"/></radialGradient></defs><rect width="1920" height="1080" fill="url(#vg)"/>`;
  (P.rings || []).forEach(r => {
    const show = Math.min(1, Math.max(0, (state.t - 0.6) / 0.6));
    const pts = ringCoords(r.lon, r.lat, r.km).map(c => map.project(c));
    svg += `<polygon points="${pts.map(p => p.x + "," + p.y).join(" ")}" fill="${TH.ring}" fill-opacity="${0.1 * show}" stroke="${TH.ring}" stroke-width="3" stroke-dasharray="14 10" opacity="${show}"/>`;
  });
  (P.arrows || []).forEach((a, i) => {
    const s = Math.min(1, Math.max(0, (state.t - 0.8 - i * 0.3) / 1.4)), se = 1 - Math.pow(1 - s, 3);
    if (s <= 0) return;
    const A = map.project(a.from), B = map.project(a.to);
    const mx = (A.x + B.x) / 2 - (B.y - A.y) * 0.18, my = (A.y + B.y) / 2 + (B.x - A.x) * 0.18;
    const n = 40, pts = [];
    for (let j = 0; j <= Math.round(n * se); j++) { const u = j / n; pts.push([(1-u)*(1-u)*A.x + 2*(1-u)*u*mx + u*u*B.x, (1-u)*(1-u)*A.y + 2*(1-u)*u*my + u*u*B.y]); }
    if (pts.length > 1) svg += `<polyline points="${pts.map(p => p.join(",")).join(" ")}" fill="none" stroke="${TH.arrow}" stroke-width="7" stroke-linecap="round" marker-end="url(#ah)"/>`;
  });
  if (TH.grid) { for (let x = 0; x <= 1920; x += 120) svg += `<line x1="${x}" y1="0" x2="${x}" y2="1080" stroke="${TH.grid}" stroke-width="1"/>`;
                 for (let y = 0; y <= 1080; y += 120) svg += `<line x1="0" y1="${y}" x2="1920" y2="${y}" stroke="${TH.grid}" stroke-width="1"/>`; }
  if (TH.sweep && (P.rings || [])[0]) { const r0 = P.rings[0], c = map.project([r0.lon, r0.lat]), e2 = map.project(ringCoords(r0.lon, r0.lat, r0.km)[0]);
    const R = Math.hypot(e2.x - c.x, e2.y - c.y), a = state.t * 2.2;
    svg += `<line x1="${c.x}" y1="${c.y}" x2="${c.x + R * Math.cos(a)}" y2="${c.y + R * Math.sin(a)}" stroke="${TH.ring}" stroke-width="4" opacity=".9"/>`;
    [0.33, 0.66].forEach(f => svg += `<circle cx="${c.x}" cy="${c.y}" r="${R * f}" fill="none" stroke="${TH.ring}" stroke-width="1.5" opacity=".5"/>`); }
  if (TH.grain) svg += `<filter id="gr"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="${Math.floor(state.t * 30)}"/><feColorMatrix type="saturate" values="0"/></filter><rect width="1920" height="1080" filter="url(#gr)" opacity="${TH.grain}" style="mix-blend-mode:overlay"/>`;
  if (TH.scan) svg += `<rect width="1920" height="1080" fill="url(#scan)"/><defs><pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="2" fill="rgba(0,0,0,.18)"/></pattern></defs>`;
  fx.innerHTML = svg;
  let lab = "";
  (P.points || []).forEach((p, i) => {
    const o = Math.min(1, Math.max(0, (state.t - 0.4 - i * 0.15) / 0.3)), q = map.project([p.lon, p.lat]);
    lab += `<div style="position:absolute;left:${q.x}px;top:${q.y}px;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:${TH.accent};box-shadow:0 0 0 6px rgba(0,0,0,.25);opacity:${o}"></div>` +
           `<div class="lbl small" style="left:${q.x}px;top:${q.y - 36}px;opacity:${o};color:${TH.accent};font-family:${TH.font}">${p.name}</div>`;
  });
  (P.countries || []).forEach(c => { const q = map.project(c.at); lab += `<div class="lbl" style="left:${q.x}px;top:${q.y}px;color:${TH.label};font-family:${TH.font}">${c.name}</div>`; });
  if (P.title) lab += `<div class="title" style="opacity:${Math.min(1, state.t / 0.3)}"><div class="bar"></div><div class="txt">${P.title}</div></div>`;
  if (TH.satellite && P.token) lab += `<div style="position:absolute;right:18px;bottom:12px;font:500 15px ${TH.font};color:rgba(255,255,255,.75)">© Mapbox © OpenStreetMap</div>`;
  document.getElementById("labels").innerHTML = lab;
}
const mapReady = new Promise(res => map.loaded() ? res() : map.once("load", res));
Promise.all([fetch("countries.geojson").then(r => r.json()), mapReady, document.fonts ? document.fonts.ready : 0]).then(([geo]) => {
  {
    if (!Object.keys(HL).length) HL["___"] = TH.land;      // a match expression needs at least one pair
    if (TH.satellite && P.token) {          // real satellite imagery (Mapbox), graded by the theme
      map.addSource("sat", {type: "raster", tileSize: 512, maxzoom: 19,
        tiles: ["https://api.mapbox.com/v4/mapbox.satellite/{z}/{x}/{y}@2x.jpg90?access_token=" + P.token]});
      const S = Object.assign({"raster-saturation": 0, "raster-contrast": 0, "raster-brightness-max": 1, "raster-brightness-min": 0,
                               "raster-hue-rotate": 0}, TH.sat || {});
      map.addLayer({id: "sat", type: "raster", source: "sat", paint: Object.assign({"raster-fade-duration": 0}, S)});
    }
    map.addSource("c", {type: "geojson", data: geo});
    map.addLayer({id: "land", type: "fill", source: "c", paint: {"fill-color": ["match", ["get", "iso"], ...Object.entries(HL).flat(), TH.land],
                                                                  "fill-opacity": ["match", ["get", "iso"], ...Object.keys(HL).flatMap(k => [k, TH.hl_opacity]), TH.satellite && P.token ? TH.land_opacity : 1]}});
    map.addLayer({id: "border", type: "line", source: "c", paint: {"line-color": TH.border, "line-width": 1.2}});
    map.addLayer({id: "hl", type: "line", source: "c", filter: ["in", ["get", "iso"], ["literal", Object.keys(HL)]],
                  paint: {"line-color": TH.hl, "line-width": 3}});
    const idle = (ms) => new Promise(res => { let done = false; const f = () => { if (!done) { done = true; res(); } };
      map.once("idle", f); setTimeout(f, ms); map.triggerRepaint(); });
    async function warm() {                 // satellite: fly the whole camera path once so every tile is cached
      if (!(TH.satellite && P.token)) return;
      for (let i = 0; i <= 24; i++) { state.t = D * i / 24; draw(); await idle(4000); }
      state.t = 0; draw(); await idle(4000);
    }
    warm().then(function ready() {          // the borders are loaded -> the timeline exists (HyperFrames waits for it)
      if (!map.isSourceLoaded("c")) return setTimeout(ready, 50);
      const tl = gsap.timeline({paused: true, onUpdate: draw});
      tl.to(state, {t: D, duration: D, ease: "none"}, 0);
      draw();
      window.__timelines = window.__timelines || {};
      window.__timelines["root"] = tl;
    });
  }
});
</script>
</body>
</html>
