[project]
name = "warstudio"
version = "1.14.0"
description = "WarStudio: script in, synced military documentary video out."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "httpx",
    "numpy",
    "pillow",
    "torch",
    "open_clip_torch",
    "pyobjc-framework-Vision; sys_platform == 'darwin'",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false
